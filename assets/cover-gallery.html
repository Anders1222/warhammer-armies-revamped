<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book cover illustrations</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#292720;font:16px/1.5 system-ui,sans-serif}
header{padding:24px clamp(20px,5vw,72px);border-bottom:1px solid #c9c0ad;background:#fffdf7}
h1{font:600 32px Georgia,serif;margin:0 0 8px}p{margin:4px 0 16px;max-width:70ch}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,label{font:inherit}
button{padding:7px 14px;border:1px solid #a69b87;border-radius:6px;background:#fff;cursor:pointer}
button[aria-pressed=true]{background:#39372e;color:white}input{vertical-align:middle;cursor:pointer}
main{--art-bg:url('images/parchment.jpg');display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:24px clamp(20px,5vw,72px)}
figure{margin:0;border:1px solid #d2c9b9;border-radius:8px;overflow:hidden;background:white}
figure a{display:block;background:var(--art-bg);background-size:cover;padding:14px}
img{width:100%;height:auto;display:block}figcaption{padding:12px 16px;font:600 18px Georgia,serif;border-top:1px solid #d2c9b9}
footer{padding:20px clamp(20px,5vw,72px)}a{color:inherit}:focus-visible{outline:3px solid #287aac;outline-offset:3px}
main[data-background=checkerboard] figure a{background:conic-gradient(#d7d7d7 25%,#fff 0 50%,#d7d7d7 0 75%,#fff 0) 0 0/24px 24px}
</style>
<header><h1>Book cover illustrations</h1><p>31 faction illustrations and the main rulebook cover. Choose a background to inspect the transparent edges. Click an illustration to open the original PNG.</p>
<div class="controls" aria-label="Illustration background">
<button data-bg="parchment" aria-pressed="true">Parchment</button><button data-bg="light" aria-pressed="false">Light</button><button data-bg="dark" aria-pressed="false">Dark</button><button data-bg="checkerboard" aria-pressed="false">Checkerboard</button>
<label>Custom <input type="color" value="#8c9fb0" aria-label="Custom illustration background"></label>
</div></header>

<script>
const grid=document.querySelector('main');
const backgrounds={parchment:"url('images/parchment.jpg')",light:'#ffffff',dark:'#20232a'};
function selectBackground(name,value){grid.dataset.background=name;grid.style.setProperty('--art-bg',value||backgrounds[name]||'#fff');document.querySelectorAll('button[data-bg]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bg===name)));}
document.querySelectorAll('button[data-bg]').forEach(b=>b.addEventListener('click',()=>selectBackground(b.dataset.bg)));
document.querySelector('input[type=color]').addEventListener('input',e=>selectBackground('custom',e.target.value));
</script>
